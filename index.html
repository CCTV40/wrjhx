<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>无人机航线规划 纯原生版</title>
    <style>
        body {margin:0; padding:10px; font-family:微软雅黑;}
        #canvas {border:2px solid #333;background:#e8f4f8;}
        #panel {margin-top:10px;padding:10px;background:#f5f5f5;display:flex;gap:30px;flex-wrap:wrap;}
        .btn {margin:5px;padding:6px 15px;cursor:pointer;}
    </style>
</head>
<body>
    <div>
        <button class="btn" onclick="setMode('obstacle')">绘制障碍物</button>
        <button class="btn" onclick="setMode('waypoint')">添加航点</button>
        <button class="btn" onclick="startFly()">开始模拟飞行</button>
        <button class="btn" onclick="clearAll()">清空全部</button>
    </div>

    <canvas id="canvas" width="1200" height="500"></canvas>

    <div id="panel">
        <div>当前航点：<span id="wpInfo">0/0</span></div>
        <div>飞行速度：<span id="speedInfo">0 m/s</span></div>
        <div>已飞时间：<span id="timeInfo">00:00</span></div>
        <div>剩余距离：<span id="disInfo">0 m</span></div>
        <div>电量：<span id="batteryInfo">100%</span></div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let mode = 'waypoint';
let obstacles = [];
let waypoints = [];
let safetyR = 30;
let flyTimer = null;
let flyIndex = 0;

function setMode(m){
    mode = m;
}

canvas.onclick = function(e){
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    if(mode === 'waypoint'){
        if(checkInSafeZone(x,y)){
            alert('不能在障碍物安全范围内设置航点！');
            return;
        }
        waypoints.push({x,y});
        drawAll();
        updatePanel();
    }
}

let drawing = false;
let tempObs = [];

canvas.onmousedown = function(e){
    if(mode !== 'obstacle') return;
    drawing = true;
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    tempObs = [{x,y}];
}

canvas.onmousemove = function(e){
    if(!drawing || mode !== 'obstacle') return;
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    tempObs.push({x,y});
    drawAll();
    drawTempObs();
}

canvas.onmouseup = function(){
    if(drawing && tempObs.length > 3){
        obstacles.push([...tempObs]);
    }
    drawing = false;
    tempObs = [];
    drawAll();
}

function checkInSafeZone(px,py){
    for(let obs of obstacles){
        for(let p of obs){
            let d = Math.hypot(px-p.x, py-p.y);
            if(d < safetyR) return true;
        }
    }
    return false;
}

function drawAll(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    drawObstacles();
    drawWayLine();
    drawWaypoints();
}

function drawGrid(){
    ctx.strokeStyle='#ccc';
    ctx.lineWidth=1;
    for(let i=0;i<canvas.width;i+=40){
        ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke();
    }
    for(let i=0;i<canvas.height;i+=40){
        ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke();
    }
}

function drawObstacles(){
    for(let obs of obstacles){
        ctx.fillStyle='rgba(255,100,100,0.2)';
        ctx.strokeStyle='red';
        ctx.beginPath();
        ctx.moveTo(obs[0].x,obs[0].y);
        for(let p of obs) ctx.lineTo(p.x,p.y);
        ctx.closePath();
        ctx.fill();ctx.stroke();
    }
}

function drawTempObs(){
    if(tempObs.length<2) return;
    ctx.strokeStyle='#999';
    ctx.beginPath();
    ctx.moveTo(tempObs[0].x,tempObs[0].y);
    for(let p of tempObs) ctx.lineTo(p.x,p.y);
    ctx.stroke();
}

function drawWayLine(){
    if(waypoints.length<2) return;
    ctx.strokeStyle='blue';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(waypoints[0].x,waypoints[0].y);
    for(let p of waypoints) ctx.lineTo(p.x,p.y);
    ctx.stroke();
}

function drawWaypoints(){
    for(let i=0;i<waypoints.length;i++){
        let p = waypoints[i];
        ctx.fillStyle='blue';
        ctx.beginPath();
        ctx.arc(p.x,p.y,6,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#000';
        ctx.fillText(i+1,p.x+8,p.y-5);
    }
}

function updatePanel(){
    document.getElementById('wpInfo').innerText = waypoints.length+"/"+waypoints.length;
    document.getElementById('speedInfo').innerText = "8.0 m/s";
    document.getElementById('timeInfo').innerText = "00:00";
    document.getElementById('disInfo').innerText = "-- m";
    document.getElementById('batteryInfo').innerText = "100%";
}

function startFly(){
    if(waypoints.length<2){
        alert('请先至少添加2个航点');
        return;
    }
    flyIndex = 0;
    let time = 0;
    if(flyTimer) clearInterval(flyTimer);
    flyTimer = setInterval(()=>{
        flyIndex++;
        if(flyIndex >= waypoints.length){
            clearInterval(flyTimer);
            alert('飞行任务完成');
            return;
        }
        time++;
        let min = Math.floor(time/60);
        let sec = time%60;
        let timeStr = String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0');
        let bat = Math.max(0,100 - flyIndex*5);

        document.getElementById('wpInfo').innerText = (flyIndex+1)+"/"+waypoints.length;
        document.getElementById('timeInfo').innerText = timeStr;
        document.getElementById('batteryInfo').innerText = bat+"%";
    },1000);
}

function clearAll(){
    if(flyTimer) clearInterval(flyTimer);
    obstacles = [];
    waypoints = [];
    flyIndex = 0;
    drawAll();
    updatePanel();
}

window.onload = drawAll;
</script>
</body>
</html>
